# Lumi secrets — the API keys and tokens of an instance (v2.9). GENERATED from core/settings.py by
# `python scripts/settings_examples.py` — do not edit by hand.
#
# Copy to secrets.yaml (gitignored) and `chmod 600 secrets.yaml`; fill in only the keys you use (the active
# provider's, the bot token, the server token). Never commit a real key. `lumi-cli config` masks every
# secret on every output; `lumi-cli config set <group.key> <value>` writes one here.

server:
  # The client token — required to serve; never logged. Make one: python3 -c "import secrets; print(secrets.token_urlsafe(32))". · env LUMI_SERVER_TOKEN
  # token:

providers:
  # The Anthropic (Claude) key — console.anthropic.com. · env ANTHROPIC_API_KEY
  # anthropic_api_key:
  # The OpenAI key (also the OpenAI embedder) — platform.openai.com. · env OPENAI_API_KEY
  # openai_api_key:
  # The DeepSeek key — platform.deepseek.com. · env DEEPSEEK_API_KEY
  # deepseek_api_key:
  # The MiniMax key — the MiniMax console. · env MINIMAX_API_KEY
  # minimax_api_key:
  # The Google Gemini key — the engine, image generation and web lookup — aistudio.google.com. · env GEMINI_API_KEY · formerly GOOGLE_API_KEY
  # gemini_api_key:
  # The Voyage key (the cloud embedder) — dash.voyageai.com. · env VOYAGE_API_KEY
  # voyage_api_key:

news:
  # The Guardian developer key — open-platform.theguardian.com. · env LUMI_NEWS_API_KEY
  # api_key:

telegram:
  # The bot token from @BotFather — never logged. · env LUMI_TELEGRAM_TOKEN
  # token:

voice:
  # The ElevenLabs key (TTS, Scribe STT) — elevenlabs.io. · env ELEVENLABS_API_KEY
  # elevenlabs_api_key:

dictation:
  # The Deepgram key (cloud STT) — console.deepgram.com. · env DEEPGRAM_API_KEY
  # deepgram_api_key:
