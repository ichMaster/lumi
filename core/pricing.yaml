# Lumi model prices — USD per 1,000,000 tokens (provider list prices). v2.10: the ONE source the usage report,
# /usage and the admin panel read (core/usage.py pricing_for); docs/MODEL_PRICING.md explains them.
#
# Lookup order (pricing_for): an exact id, then the FIRST key the id starts with — so a more specific id goes
# before a shorter one (gemini-2.5-flash-lite before gemini-2.5-flash) — then the family (haiku / sonnet / flash),
# then `default` (an opus-tier estimate for an unknown model).

models:
  claude-fable-5: {input: 10.0, output: 50.0}
  claude-opus-4-8: {input: 5.0, output: 25.0}
  claude-opus-4-7: {input: 5.0, output: 25.0}
  claude-opus-4-6: {input: 5.0, output: 25.0}
  claude-opus-4-5: {input: 5.0, output: 25.0}
  claude-sonnet-5: {input: 3.0, output: 15.0}      # the $2/$10 intro price ended on Sep 1, 2026
  claude-sonnet-4-6: {input: 3.0, output: 15.0}
  claude-sonnet-4-5: {input: 3.0, output: 15.0}
  claude-haiku-4-5: {input: 1.0, output: 5.0}
  gemini-3.1-pro: {input: 2.0, output: 12.0}
  gemini-3.7-flash: {input: 0.75, output: 3.75}
  gemini-3.6-flash: {input: 0.75, output: 3.75}
  gemini-3.5-flash: {input: 1.5, output: 9.0}
  gemini-2.5-flash-lite: {input: 0.10, output: 0.40}
  gemini-2.5-flash: {input: 0.30, output: 2.50}

default: {input: 5.0, output: 25.0}

# Cached input, as a multiple of the model's input price (Anthropic's rules; Gemini's explicit cache is billed the
# same way in these estimates).
cache:
  read: 0.10
  write_5m: 1.25
  write_1h: 2.0
