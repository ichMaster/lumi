  # The inbox. Unset → <data root>/inbox.jsonl. · env LUMI_INBOX_PATH
  # inbox_path:
  # The outbox. Unset → <data root>/outbox.jsonl. · env LUMI_OUTBOX_PATH
  # outbox_path:

telegram:
  # The Telegram user ids served (the owner's). · a list of integer ids · env LUMI_TELEGRAM_ALLOWLIST
