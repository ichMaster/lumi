  # Display targets for a generated PNG. · a list of strings (or one comma-separated string) · env LUMI_IMAGE_SHOW
  # show: [path, viewer, telegram]

bridge:
  # The TUI reads the inbox / writes the outbox. · env LUMI_BRIDGE
