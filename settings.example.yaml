  # The STT model. Unset → the provider's default. · env LUMI_STT_MODEL
  # stt_model:
  # The recognition language. · env LUMI_STT_LANG
  # stt_lang: uk
  # The mic: an index or a name substring. · env LUMI_STT_DEVICE
  # stt_device:
  # The listen toggle. Unset → <data root>/listen.flag. · env LUMI_LISTEN_FLAG
